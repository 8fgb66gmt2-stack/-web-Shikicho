<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0f12">
<title>長官室｜四季廳</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="imperial.css">
<link rel="stylesheet" href="ryoryo.css">
<link rel="stylesheet" href="report-room.css">
<style>
.chief-page{min-height:100vh;background:#0e0f12;padding:40px 20px;box-sizing:border-box}
.chief-room-page{max-width:920px;margin:0 auto}
.chief-document{margin:20px auto;padding:48px 54px;background:#f3eee3;color:#211d19;border:1px solid #806b51;box-shadow:0 18px 60px rgba(0,0,0,.35);font-family:serif;line-height:1.95}
.chief-seal{letter-spacing:.18em;text-align:center;font-size:.85rem;margin-bottom:30px;color:#5f4b38}
.chief-document h1{font-size:2rem;letter-spacing:.12em;text-align:center;font-weight:500;margin:0 0 20px}
.chief-document p{margin:18px 0}
.chief-rule{height:1px;background:#806b51;margin:26px 0}
.chief-alert{padding:14px 18px;border:1px solid #806b51;background:rgba(128,107,81,.08)}
#chief-subject{word-break:break-word}
.chief-return{display:block;margin:32px auto 0;padding:12px 24px;background:transparent;border:1px solid #5f4b38;color:#211d19;cursor:pointer;font:inherit;letter-spacing:.08em}
@media(max-width:600px){.chief-document{padding:30px 22px}.chief-document h1{font-size:1.5rem}}
</style>
</head>
<body class="chief-page">
<main class="chief-room-page">
<div class="chief-document">
<div class="chief-seal">日ノ本帝國　四季廳　長官室</div>
<p class="eyebrow">CHIEF SECRETARIAT / CONFIDENTIAL</p>
<h1>長官室への御案内</h1>
<div class="chief-rule"></div>
<p>通報資料の受付処理が完了しました。</p>
<p class="chief-alert">【機密取扱】　本件は通常相談案件として処理されません。</p>
<p>確認された資料に関する記録は、四季廳長官室へ直接回付されました。</p>
<div class="chief-rule"></div>
<p id="chief-reference">回付番号：確認中</p>
<p id="chief-subject"></p>
<p>長官室にて資料照合を行います。以後の閲覧には、別途権限が必要となる場合があります。</p>
<button type="button" class="chief-return" onclick="location.href='index.html#contact'">四季廳本廳舍へ戻る</button>
</div>
</main>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('chief-reference').textContent='回付番号：'+(q.get('ref')||'未記録');
document.getElementById('chief-subject').textContent=q.get('subject')?'件名：'+q.get('subject'):'';
</script>
</body>
</html>
