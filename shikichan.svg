<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" role="img" aria-labelledby="title desc">
<title id="title">四季廳公式マスコット しきちょうちゃん</title>
<desc id="desc">象牙色のふわふわした丸い顔、薄藤色の長い垂れ耳、金の花章をつけた臙脂色の制帽と、金の花飾りがある臙脂色の制服を着た、かわいらしい四季廳のマスコット。</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#eee3d9"/></linearGradient>
 <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7b2944"/><stop offset="1" stop-color="#421426"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b8"/><stop offset=".5" stop-color="#d6ad5c"/><stop offset="1" stop-color="#9b6b32"/></linearGradient>
 <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9dfe9"/><stop offset="1" stop-color="#b7a4c3"/></linearGradient>
</defs>
<ellipse cx="240" cy="491" rx="140" ry="16" fill="#5a2638" opacity=".12"/>
